# Curated decisions the importer cannot derive from the sheets.
#
# Rows are referenced by identity key (`bun run import --keys` lists them),
# never by URL or file name. Keys survive rows being moved or re-ordered in the
# sheets; if an editor renames a row its key changes and the importer reports
# the stale reference instead of silently dropping the decision.

links:
  # Citations that are public although their host defaults to private.
  public_rows:
    # Kenneth G's own SoundCloud upload of his self-released track.
    - b.unreleased:lim-kenneth-g
  # Citations kept private although their host is normally fine.
  private_rows:
    # Reddit thread about the leak itself.
    - b.unreleased:made-in-china-tv-noise

notes:
  redact:
    # Don't name the place leaks are sold.
    - { pattern: "TheSource\\.to|thesource", replace: "a leak marketplace" }

artists:
  # Names that contain a separator and must not be split.
  acts:
    - "Matisse & Sadko"
    - "Axwell /\\ Ingrosso"
    - "Vargas & Lagola"
    - "Bono & The Edge"
  # Sheet spelling -> canonical name.
  spellings:
    Nijia: Nija
    Jen Hult: Jens Hult
    Talay Ridley: Talay Riley
    Talay Reiley: Talay Riley
    Sasha Sloan: Sasha Alex Sloan
    Maneskin: Måneskin
    Danny Ávila: Danny Avila
    HeadHunterz: Headhunterz
    Schoolboy: SchoolBoy
    Charlie XCX: Charli XCX
    Arjit Singh: Arijit Singh
  # Sheet B lists collaborators without a role. These are credited as featured
  # vocalists; everyone else in that column is treated as a co-lead artist.
  vocalists:
    - Bonn
    - John Martin
    - Shaun Farrugia
    - Jaimes
    - Mike Shinoda
    - Troye Sivan
    - Ellie Goulding
    - Ne-Yo
    - Jake Torrey
    - Tom Walker
    - Maejor
    - Sasha Alex Sloan
    - G-Eazy
    - Ed Sheeran
    - Tori Kelly
    - Jens Hult
    - Simon Aldred
    - Ryan Tedder
    - Charli XCX
  # Other names an artist is searched by.
  aliases:
    Martin Garrix: [GRX, YTRAM]

skip:
  a.unreleased:untitled: >-
    Nameless row under 2025 carrying only OG / Full / Lossless. Nothing to
    document until the editors give it a name.
  b.unreleased:arjit-singh: Collaborator name only, with no title, source or notes.
  b.unreleased:alan-walker: Collaborator name only, with no title, source or notes.

