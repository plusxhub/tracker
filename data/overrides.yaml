# Terms the site uses that the sheet's own key does not define.
glossary_extra:
  - category: availability
    slug: none
    term: Not circulating
    definition: No audio of this version is known to be in circulation.
  - category: availability
    slug: circulating
    term: Circulating
    definition: A copy is known to circulate, but how complete it is has not been documented.
  # The sheet's wording for these assumes it hosts the audio. The site does not.
  - category: tag
    slug: best_of
    term: Best Of
    definition: Standout entries, picked by the editors of the community trackers.
  - category: tag
    slug: grail
    term: Grail
    definition: The most wanted songs that have not surfaced in full.
  - category: tag
    slug: wanted
    term: Wanted
    definition: Sought after, though not as much as a Grail.
  - category: tag
    slug: ai
    term: AI vocals
    definition: The recording contains AI-generated vocals.
